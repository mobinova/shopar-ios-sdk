name: iOS SDK release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift package resolve
      - run: swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios16.0 --target ShoparAgency
      - run: swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios16.0 --target ShoparDiscovery
      - run: swift build --package-path Examples/ShoparIntegrationSample --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios16.0
      - run: plutil -lint Sources/ShoparAgency/PrivacyInfo.xcprivacy Sources/ShoparDiscovery/PrivacyInfo.xcprivacy
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
